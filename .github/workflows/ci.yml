name: CI/CD Pipeline - Sistema de Votación

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: "super-secret-test-key-for-ci-pipeline-12345"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Ejecutar pruebas y generar cobertura
        run: |
          python -m coverage run -m pytest tests/ -v
          python -m coverage xml

  docker-build-test:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker optimizada (Multi-stage)
        run: |
          docker build -t sistema-votacion:latest .
          echo "=== COMPARATIVA DE TAMAÑO DE IMAGEN DOCKER ==="
          docker images sistema-votacion:latest