name: CI/CD Pipeline - Sistema de Votación

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ETAPA 1: TEST
  test:
    name: 1. Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Crear archivo .env para pruebas
        run: |
          echo "JWT_SECRET_KEY=super-secret-test-key-for-ci-pipeline-12345" >> .env
          echo "GEMINI_API_KEY=mock-gemini-api-key-for-testing" >> .env

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Ejecutar pruebas y cobertura
        run: |
          python -m coverage run -m pytest tests/ -v
          python -m coverage xml

  # ETAPA 2: BUILD Y PUSH
  build-and-push:
    name: 2. Build & Push Docker Hub
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sistema-votacion:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sistema-votacion:${{ github.sha }}

  # ETAPA 3: VALIDACIÓN DOCKER COMPOSE
  validate-compose:
    name: 3. Validate Docker Compose
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar orquestación Docker Compose
        run: |
          docker compose up -d --wait
          docker compose ps
          docker compose down -v